# joycond configuration file
#
# Format: "key = value" lines. Blank lines and lines starting with '#'
# are ignored. Unknown keys are reported in the daemon log.
# If this file is absent, all built-in defaults apply.

# Swap the A/B and X/Y buttons (on paired joy-cons and the pro controller).
# Specifically, this remaps:
# - A (EAST) -> BTN_SOUTH event (keycode 0x130)
# - B (SOUTH) -> BTN_EAST event (keycode 0x131)
# - Y (WEST) -> BTN_NORTH event (keycode 0x133)
# - X (NORTH) -> BTN_WEST event (keycode 0x134)
# true | false (default: false)
#swap_ab_xy = true

# Remap of HOME and CAP buttons to thumbstick click events.
# (on paired joy-cons and the pro controller).
# - CAP (capture) button -> LSTICK event
# - HOME button -> RSTICK event
# true | false (default: false)
#thumb_btn_remap_1 = true

# Turn off the IMU (gyro/accelerometer) on the controllers upon connection.
# true | false (default: false)
#disable_imu = true

# Scale the rumble magnitudes forwarded to the physical joy-cons.
# Number in 0.0 (off) - 1.0 (full). (default: 1.0)
#rumble_gain = 0.5

# Which physical joy-con receives rumble events on the paired joy-cons.
# both | left | right | off (default: both)
#pair_rumble_mode = left
