# joycond configuration file
#
# Format: "key = value" lines. Blank lines and lines starting with '#'
# are ignored. Unknown keys are reported in the daemon log.
# If this file is absent, all built-in defaults apply.

# Swap the A/B and X/Y buttons on the combined controller. true | false (default: false)
#swap_ab_xy = true

# Turn off the IMU (gyro/accelerometer) report stream on the physical
# controllers when they connect. true | false (default: false)
#disable_imu = true

# Scale the rumble magnitudes forwarded to the physical joy-cons.
# Number in 0.0 (off) - 1.0 (full). (default: 1.0)
#rumble_gain = 1.0

# Which physical joy-con receives rumble on the paired (combined)
# controller. both | left | right | off (default: both)
#pair_rumble_mode = left
